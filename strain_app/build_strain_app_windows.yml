# Builds the Windows program of strain_app/ (nartfem Strain Calculator) on a GitHub Windows machine.
# GitHub -> Actions -> "Build strain app (Windows)" -> Run workflow; when it is green, download the
# "nartfem_strains_windows" artifact (a zip with the .exe, HOW_TO_USE.txt and the examples).
name: Build strain app (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install numpy "scipy>=1.13" pyinstaller

      - name: Build the executable
        working-directory: strain_app
        run: pyinstaller --noconfirm --clean --onefile --name nartfem_strains --paths . --paths .. --exclude-module matplotlib --exclude-module tkinter --exclude-module pypardiso --exclude-module pyamg --exclude-module pandas --exclude-module PIL --exclude-module IPython --exclude-module pytest --distpath dist --workpath build_tmp --specpath build_tmp app.py

      - name: Self-test the packaged program
        working-directory: strain_app
        run: .\dist\nartfem_strains.exe --selftest

      - name: Add the instructions and examples
        working-directory: strain_app
        run: |
          Copy-Item HOW_TO_USE.txt dist\
          New-Item -ItemType Directory -Force dist\examples | Out-Null
          Copy-Item examples\*.json dist\examples\

      - uses: actions/upload-artifact@v4
        with:
          name: nartfem_strains_windows
          path: strain_app/dist/
