[project]
name = "nartfem"
version = "0.1.0"
description = "nartfem - nonlinear pavement finite element analysis in Python (port of MatFEA: axisymmetric nonlinear unbound layers + NCHRP 1-50 geogrid)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy>=1.13", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nartfem*"]
